<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rk Music</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#121212;color:#fff;padding-bottom:120px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#181818;position:sticky;top:0;z-index:9}
.logo{color:#1db954;font-weight:bold;font-size:20px;display:flex;align-items:center;gap:6px}
.btn{background:#1db954;color:#000;border:none;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:12px;cursor:pointer}

/* YouTube Input */
.yt-box{display:flex;gap:8px;padding:10px 16px 4px}
.yt-box input{flex:1;padding:9px 14px;background:#242424;border:1px solid #333;border-radius:20px;color:#fff;outline:none;font-size:13px}
.yt-btn{background:#e50914;color:#fff;border:none;padding:0 14px;border-radius:20px;font-weight:bold;font-size:12px;cursor:pointer}

/* YouTube Frame */
.yt-screen{width:100%;max-width:360px;margin:10px auto;border-radius:10px;overflow:hidden;background:#000;display:none;aspect-ratio:16/9}
.yt-screen iframe{width:100%;height:100%;border:none}

/* Tabs */
.tabs{display:flex;gap:10px;padding:10px 16px 4px}
.tab-btn{background:#242424;color:#aaa;border:none;padding:6px 14px;border-radius:16px;font-size:13px;font-weight:bold;cursor:pointer}
.tab-btn.active{background:#1db954;color:#000}

/* Search */
.search-box{padding:6px 16px 10px}
.search-box input{width:100%;padding:9px 14px;background:#242424;border:none;border-radius:20px;color:#fff;outline:none;font-size:13px}

/* List */
.song-list{list-style:none;padding:0 12px}
.song-item{display:flex;align-items:center;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px}
.song-item.active{background:#282828;color:#1db954}
.song-thumb{width:45px;height:45px;border-radius:6px;object-fit:cover;margin-right:12px;background:#333}
.song-info{flex:1;overflow:hidden}
.song-title{font-size:14px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:12px;color:#888}
.empty-msg{text-align:center;color:#666;padding:30px 16px;font-size:13px}

/* Bottom Player */
.player{position:fixed;bottom:0;left:0;width:100%;background:#181818;border-top:1px solid #282828;padding:8px 16px;z-index:99}
.seek-wrap{display:flex;align-items:center;gap:8px;font-size:11px;color:#aaa}
.seek-bar{flex:1;height:5px;background:#444;border-radius:3px;cursor:pointer;position:relative}
.fill{width:0%;height:100%;background:#1db954;border-radius:3px}
.p-body{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.track-meta{max-width:40%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.p-controls{display:flex;align-items:center;gap:8px}
.ctrl-btn{background:none;border:none;color:#fff;cursor:pointer;display:flex;align-items:center}
.play-btn{background:#fff;color:#000;border-radius:50%;padding:4px}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="material-icons">graphic_eq</span> Rk Music</div>
  <button class="btn" onclick="document.getElementById('fileIn').click()">+ Local Songs</button>
  <input type="file" id="fileIn" accept="audio/*" multiple style="display:none">
</header>

<!-- YouTube Paste Bar -->
<div class="yt-box">
  <input type="text" id="ytUrl" placeholder="Paste YouTube link...">
  <button class="yt-btn" onclick="addYoutubeLink()">Play YT</button>
</div>

<!-- Screen Frame for YouTube Video -->
<div class="yt-screen" id="ytScreen">
  <iframe id="ytIframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<!-- Navigation Tabs -->
<div class="tabs">
  <button class="tab-btn active" id="tabSongs" onclick="switchTab('songs')">Tracks</button>
  <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">History (<span id="histCount">0</span>)</button>
</div>

<!-- Search -->
<div class="search-box">
  <input type="text" id="search" placeholder="Search song..." oninput="filterCurrentView()">
</div>

<ul class="song-list" id="list"></ul>
<audio id="audio" preload="auto"></audio>

<!-- Bottom Controls -->
<div class="player">
  <div class="seek-wrap">
    <span id="cur">0:00</span>
    <div class="seek-bar" id="seekBox" onclick="seekAudio(event)">
      <div class="fill" id="fill"></div>
    </div>
    <span id="dur">0:00</span>
  </div>
  <div class="p-body">
    <div class="track-meta">
      <b id="pTitle" style="font-size:13px">No track</b><br>
      <small id="pArtist" style="color:#aaa;font-size:11px">Rk Music</small>
    </div>
    <div class="p-controls">
      <button class="ctrl-btn" onclick="skipSong(-1)"><span class="material-icons">skip_previous</span></button>
      <button class="ctrl-btn" onclick="skipSec(-10)"><span class="material-icons">replay_10</span></button>
      <button class="ctrl-btn play-btn" onclick="togglePlay()"><span class="material-icons" id="playIcon">play_arrow</span></button>
      <button class="ctrl-btn" onclick="skipSec(10)"><span class="material-icons">forward_10</span></button>
      <button class="ctrl-btn" onclick="skipSong(1)"><span class="material-icons">skip_next</span></button>
    </div>
  </div>
</div>

<script>
let songs = [
  {type:"audio", title:"Lo-Fi Beats (Sample 1)", artist:"Rk Music", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", img:"https://picsum.photos/100?1"},
  {type:"audio", title:"Chill Melodies (Sample 2)", artist:"Rk Music", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", img:"https://picsum.photos/100?2"}
];

let historyList = JSON.parse(localStorage.getItem('rk_history') || '[]');
let currentTab = 'songs';
let curIdx = 0, isPlay = false;

const audio = document.getElementById('audio'),
      listEl = document.getElementById('list'),
      pTitle = document.getElementById('pTitle'),
      pArtist = document.getElementById('pArtist'),
      fill = document.getElementById('fill'),
      curTime = document.getElementById('cur'),
      durTime = document.getElementById('dur'),
      playIcon = document.getElementById('playIcon'),
      ytScreen = document.getElementById('ytScreen'),
      ytIframe = document.getElementById('ytIframe'),
      histCount = document.getElementById('histCount');

function updateHistoryCount() {
  histCount.textContent = historyList.length;
}

function addToHistory(song) {
  historyList = historyList.filter(s => (s.title !== song.title || s.artist !== song.artist));
  historyList.unshift(song);
  if (historyList.length > 50) historyList.pop();
  localStorage.setItem('rk_history', JSON.stringify(historyList));
  updateHistoryCount();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabSongs').classList.toggle('active', tab === 'songs');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  renderList(tab === 'songs' ? songs : historyList);
}

function renderList(data) {
  if (!data || data.length === 0) {
    listEl.innerHTML = `<div class="empty-msg">${currentTab === 'history' ? 'Koi song history nahi hai.' : 'Koi gaana nahi mila.'}</div>`;
    return;
  }

  listEl.innerHTML = data.map((s, i) => {
    return `
    <li class="song-item" onclick="playSelected(${i})">
      <img class="song-thumb" src="${s.img || 'https://picsum.photos/100'}">
      <div class="song-info">
        <div class="song-title">${s.title}</div>
        <div class="song-artist">${s.artist}</div>
      </div>
      <span class="material-icons">play_circle</span>
    </li>`;
  }).join('');
}

function updateMediaSession(song) {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: song.artist,
      album: 'Rk Music',
      artwork: [{ src: song.img, sizes: '512x512', type: 'image/jpeg' }]
    });

    navigator.mediaSession.setActionHandler('play', togglePlay);
    navigator.mediaSession.setActionHandler('pause', togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack', () => skipSong(-1));
    navigator.mediaSession.setActionHandler('nexttrack', () => skipSong(1));
    navigator.mediaSession.setActionHandler('seekbackward', () => skipSec(-10));
    navigator.mediaSession.setActionHandler('seekforward', () => skipSec(10));
  }
}

function playSelected(idx) {
  const activeList = currentTab === 'songs' ? songs : historyList;
  if (!activeList[idx]) return;
  curIdx = idx;
  const song = activeList[curIdx];

  pTitle.textContent = song.title;
  pArtist.textContent = song.artist;
  addToHistory(song);
  updateMediaSession(song);

  if (song.type === "yt") {
    audio.pause();
    ytScreen.style.display = "block";
    ytIframe.src = `https://www.youtube.com/embed/${song.ytId}?autoplay=1&enablejsapi=1`;
  } else {
    ytScreen.style.display = "none";
    ytIframe.src = "";
    audio.src = song.src;
    audio.play().catch(e => console.log(e));
  }

  isPlay = true;
  playIcon.textContent = 'pause';
}

function togglePlay() {
  const activeList = currentTab === 'songs' ? songs : historyList;
  const song = activeList[curIdx];
  if (!song) return;

  if (song.type === "yt") {
    if (isPlay) {
      ytIframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
      isPlay = false;
      playIcon.textContent = 'play_arrow';
    } else {
      ytIframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      isPlay = true;
      playIcon.textContent = 'pause';
    }
  } else {
    if (audio.paused) {
      audio.play();
      isPlay = true;
      playIcon.textContent = 'pause';
    } else {
      audio.pause();
      isPlay = false;
      playIcon.textContent = 'play_arrow';
    }
  }
}

function skipSong(dir) {
  const activeList = currentTab === 'songs' ? songs : historyList;
  if (activeList.length === 0) return;
  curIdx = (curIdx + dir + activeList.length) % activeList.length;
  playSelected(curIdx);
}

function skipSec(sec) {
  const activeList = currentTab === 'songs' ? songs : historyList;
  const song = activeList[curIdx];
  if (!song) return;

  if (song.type === "yt") {
    ytIframe.contentWindow.postMessage(JSON.stringify({
      event: 'command',
      func: 'seekTo',
      args: [sec > 0 ? 10 : -10, true]
    }), '*');
  } else if (audio.duration) {
    audio.currentTime = Math.min(Math.max(audio.currentTime + sec, 0), audio.duration);
  }
}

function seekAudio(e) {
  const box = document.getElementById('seekBox').getBoundingClientRect();
  const pct = (e.clientX - box.left) / box.width;
  if (audio.duration) audio.currentTime = audio.duration * pct;
}

function fmtTime(s) {
  if (isNaN(s) || !s) return "0:00";
  return Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2, '0');
}

audio.ontimeupdate = () => {
  if (audio.duration) {
    fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    curTime.textContent = fmtTime(audio.currentTime);
  }
};

audio.onloadedmetadata = () => durTime.textContent = fmtTime(audio.duration);
audio.onended = () => skipSong(1);

function extractYtId(url) {
  const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
  return match ? match[1] : null;
}

function addYoutubeLink() {
  const input = document.getElementById('ytUrl');
  const id = extractYtId(input.value.trim());
  if (!id) {
    alert("Kripya sahi YouTube link dalein!");
    return;
  }

  const ytSong = {
    type: "yt",
    ytId: id,
    title: "YouTube Video (" + id + ")",
    artist: "YouTube Stream",
    img: "https://img.youtube.com/vi/" + id + "/hqdefault.jpg"
  };

  songs.unshift(ytSong);
  input.value = "";
  switchTab('songs');
  playSelected(0);
}

document.getElementById('fileIn').onchange = (e) => {
  Array.from(e.target.files).forEach(f => {
    songs.unshift({
      type: "audio",
      title: f.name.replace(/\.[^/.]+$/, ""),
      artist: "Device Storage",
      src: URL.createObjectURL(f),
      img: "https://picsum.photos/100"
    });
  });
  switchTab('songs');
  playSelected(0);
};

function filterCurrentView() {
  const q = document.getElementById('search').value.toLowerCase();
  const source = currentTab === 'songs' ? songs : historyList;
  renderList(source.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)));
}

updateHistoryCount();
renderList(songs);
</script>
</body>
</html>
