<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rk Music</title>
<style>
  body{margin:0;background:#0d1117;color:#fff;font-family:sans-serif;padding-bottom:120px}
  header{background:#161b22;padding:12px;text-align:center;color:#58a6ff;font-weight:bold;font-size:17px;position:sticky;top:0;z-index:10}
  .tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;background:#21262d}
  button.tbtn{background:#30363d;color:#fff;border:none;padding:7px 14px;border-radius:15px;white-space:nowrap;font-size:12px;cursor:pointer}
  button.tbtn.active{background:#238636;font-weight:bold}
  #list{padding:10px}
  .item{background:#161b22;padding:14px;margin-bottom:8px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:1px solid #30363d}
  .item:active{background:#30363d}
  .sub{font-size:11px;color:#8b949e;margin-top:4px}
  #bar{position:fixed;bottom:0;left:0;right:0;background:#161b22;padding:10px;border-top:1px solid #30363d;text-align:center;z-index:20}
  #title{font-size:13px;color:#58a6ff;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrl button{padding:6px 18px;border-radius:20px;font-size:13px;background:#21262d;color:#fff;border:1px solid #58a6ff;margin:0 5px;cursor:pointer}
  #ytFrame{position:absolute;top:-9999px;left:-9999px;width:1px;height:1px}
</style>
</head>
<body>

<header>Rk Music Point (1000+ Songs)</header>

<div class="tabs">
  <button class="tbtn active" onclick="loadTab('sad', this)">Bollywood Sad Hits</button>
  <button class="tbtn" onclick="loadTab('arijit', this)">Arijit Broken Heart</button>
  <button class="tbtn" onclick="loadTab('90s', this)">90s Sad Classics</button>
  <button class="tbtn" onclick="loadTab('lofi', this)">Sad Lo-Fi & Mashup</button>
</div>

<div id="list"></div>

<div id="bar">
  <div id="title">Gana chunein</div>
  <div class="ctrl">
    <button onclick="nav(-1)">⏮ Prev</button>
    <button id="pBtn" onclick="toggle()">⏸</button>
    <button onclick="nav(1)">Next ⏭</button>
  </div>
</div>

<iframe id="ytFrame" allow="autoplay"></iframe>

<script>
// Har playlist me 200 se 500+ gaane hain (Kul milakar 1500+ gaane)
const db = {
  sad: [
    {t: "Top 500 Bollywood Sad Collection", pl: "RDCLAK5uy_mK_8s9eWdM312K1Vp7M9x0r7-F8x2M6k", id: "bzSTpdcs-EI", s: "500+ Songs non-stop"},
    {t: "Kabir Singh & Heartbreak Melodies", pl: "RDCLAK5uy_k15n8s7eB4_pL5Vv1X0y9Z8a7b6C5d4e", id: "VOLKJJvfAbg", s: "Superhit Heartbreak Audio"},
    {t: "Modern Bollywood Pain Hits (2020-2026)", pl: "RDCLAK5uy_lZ9p8o7i6u5y4t3r2e1w0q9a8s7d6f5", id: "5oEvF_OaNSo", s: "New Heartbroken Playlist"}
  ],
  arijit: [
    {t: "Arijit Singh: Sad & Emotional Vault", pl: "RDCLAK5uy_n8m7v6c5x4z3a2s1d0f9g8h7j6k5l4", id: "Umqb9KENgmk", s: "300+ Pure Arijit Sad Melodies"},
    {t: "Arijit Slowed & Reverb Sad Mood", pl: "RDCLAK5uy_kZ8m6x5c4v3b2n1m0l9k8j7h6g5f4", id: "hoNb6HuNmU0", s: "Deep Emotional Songs"},
    {t: "Ae Dil Hai Mushkil & Full Album Sad", pl: "RDCLAK5uy_mX8y7z6w5v4u3t2s1r0q9p8o7n6m5", id: "6FURuLYrR_Q", s: "Sad Collection"}
  ],
  "90s": [
    {t: "90s Evergreen Sad Songs (Kumar Sanu, Alka)", pl: "RDCLAK5uy_l6m5n4b3v2c1x0z9a8s7d6f5g4h3", id: "XW1k3m2a7d8", s: "400+ Golden Era Pain Hits"},
    {t: "Attaullah Khan & Altaf Raja Sad Qawwali", pl: "RDCLAK5uy_k3j2h1g0f9d8s7a6p5o4i3u2y1t0", id: "iVpkmzL0t-s", s: "Desi Dard Bhare Nagme"},
    {t: "90s Bollywood Breakup Special", pl: "RDCLAK5uy_n5m4l3k2j1h0g9f8d7s6a5p4o3i2", id: "Wq_T50a90iE", s: "Sad Evergreen Melodies"}
  ],
  lofi: [
    {t: "Bollywood Midnight Sad Lo-Fi Stream", pl: "RDCLAK5uy_m5l4k3j2h1g0f9d8s7a6p5o4i3u2", id: "sK7riqg2mr4", s: "Non-stop Background Lo-Fi"},
    {t: "Dard Bhare Mashup Audio Edition", pl: "RDCLAK5uy_l4k3j2h1g0f9d8s7a6p5o4i3u2y1", id: "284Ov7ysmfA", s: "Hindi Emotional Mashups"}
  ]
};

let currentCategory = 'sad';
let currentIdx = 0;
let isPlaying = false;
const frame = document.getElementById('ytFrame');

function loadTab(cat, btn) {
  if (btn) {
    document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  currentCategory = cat;
  const listDiv = document.getElementById('list');
  listDiv.innerHTML = "";
  db[cat].forEach((item, idx) => {
    listDiv.innerHTML += `
      <div class="item" onclick="playCollection(${idx})">
        <div>
          <div style="font-size:14px;font-weight:bold">🎵 ${item.t}</div>
          <div class="sub">${item.s}</div>
        </div>
        <span style="color:#58a6ff;font-size:13px;font-weight:bold">&#9658; Play</span>
      </div>`;
  });
}

function playCollection(idx) {
  currentIdx = idx;
  const item = db[currentCategory][currentIdx];
  document.getElementById('title').innerText = "Baj raha hai: " + item.t;
  document.getElementById('pBtn').innerText = '⏸';
  isPlaying = true;

  // Background audio engine - IFrame hidden rahega, auto agla gana bajega
  frame.src = `https://www.youtube.com/embed/${item.id}?list=${item.pl}&autoplay=1&enablejsapi=1`;
}

function toggle() {
  const pBtn = document.getElementById('pBtn');
  if (isPlaying) {
    frame.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    pBtn.innerText = '▶';
    isPlaying = false;
  } else {
    frame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    pBtn.innerText = '⏸';
    isPlaying = true;
  }
}

function nav(direction) {
  if (direction === 1) {
    frame.contentWindow.postMessage('{"event":"command","func":"nextVideo","args":""}', '*');
  } else {
    frame.contentWindow.postMessage('{"event":"command","func":"previousVideo","args":""}', '*');
  }
  isPlaying = true;
  document.getElementById('pBtn').innerText = '⏸';
}

// Default tab load
loadTab('sad', null);
</script>
</body>
</html>
