<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rk Music</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;padding:10px}
h3{text-align:center;color:#00e5ff;margin:10px 0}
.box{background:#1e1e1e;padding:12px;margin:8px 0;border-radius:6px;cursor:pointer}
#bar{position:fixed;bottom:0;left:0;right:0;background:#000;padding:12px;color:#00e5ff;border-top:1px solid #333;display:none}
</style>
</head>
<body>

<h3>Rk Music (Sad Hits)</h3>
<div id="songs"></div>
<div id="bar">Baj raha hai: <b id="title"></b></div>
<iframe id="audio" style="display:none" allow="autoplay"></iframe>

<script>
const list = [
  ["Channa Mereya", "bzSTpdcs-EI"],
  ["Bekhayali - Kabir Singh", "VOLKJJvfAbg"],
  ["Tujhe Bhula Diya", "5oEvF_OaNSo"],
  ["Agar Tum Saath Ho", "sK7riqg2mr4"],
  ["Tum Hi Ho - Aashiqui 2", "Umqb9KENgmk"],
  ["Khairiyat - Arijit", "hoNb6HuNmU0"],
  ["Pachtaoge - Arijit", "PVxc5mIHVuQ"],
  ["Jiye To Jiye Kaise (90s)", "XW1k3m2a7d8"],
  ["Dil Tod Ke Hasdi (90s)", "iVpkmzL0t-s"],
  ["Tadap Tadap Ke (90s)", "Wq_T50a90iE"]
];

const songsDiv = document.getElementById("songs");
list.forEach(([name, id]) => {
  songsDiv.innerHTML += `<div class="box" onclick="play('${id}','${name}')">🎵 ${name}</div>`;
});

function play(id, name) {
  document.getElementById("bar").style.display = "block";
  document.getElementById("title").innerText = name;
  document.getElementById("audio").src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1";
}
</script>

</body>
</html>
