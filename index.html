<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rk Music Point 🎧</title>
  
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #121212; color: #fff; padding-bottom: 140px; }
    header { padding: 14px 16px; background: #181818; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282828; position: sticky; top: 0; z-index: 10; }
    .logo { font-size: 17px; font-weight: bold; }
    .user-btn { background: #242424; color: #1db954; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
    
    .search-box { padding: 10px 16px; background: #181818; display: flex; flex-direction: column; gap: 8px; }
    .search-input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background: #242424; color: #fff; font-size: 13px; outline: none; }
    .yt-box { display: flex; gap: 6px; }
    .yt-btn { background: #ff0000; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }

    .ad-btn { display: block; margin: 10px 16px; padding: 10px; background: linear-gradient(45deg, #ff416c, #ff4b2b); color: #fff; text-align: center; text-decoration: none; font-weight: bold; font-size: 12px; border-radius: 8px; }
    
    .tab-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-bottom: 1px solid #222; }
    .tab-btn { background: none; border: none; color: #777; font-size: 14px; font-weight: bold; padding: 6px 12px; border-radius: 14px; cursor: pointer; }
    .tab-btn.active { background: #252525; color: #1db954; }
    .clear-btn { background: none; border: 1px solid #444; color: #888; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; display: none; }

    .song-list { list-style: none; padding: 8px 16px; }
    .song-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #1a1a1a; cursor: pointer; }
    .song-item img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; margin-right: 12px; background: #282828; }
    .song-info { flex: 1; overflow: hidden; }
    .song-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-title.active { color: #1db954; }
    .song-artist { font-size: 12px; color: #888; margin-top: 3px; }
    .play-icon { font-size: 18px; color: #888; padding: 10px; }
    .play-icon.active { color: #1db954; }

    .yt-view { display: none; margin: 10px 16px; background: #000; border-radius: 10px; overflow: hidden; position: relative; padding-bottom: 56.25%; height: 0; }
    .yt-view iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }
    .yt-close { position: absolute; top: 6px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; z-index: 5; cursor: pointer; }

    .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal.active { display: flex; }
    .modal-box { background: #1e1e1e; border-radius: 10px; padding: 20px; width: 100%; max-width: 320px; position: relative; }
    .modal-input { width: 100%; padding: 10px; border-radius: 6px; background: #2a2a2a; border: 1px solid #444; color: #fff; margin-bottom: 12px; font-size: 13px; outline: none; }
    .modal-btn { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #1db954; color: #000; font-weight: bold; cursor: pointer; }
    .modal-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #888; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Rk Music Point 🎧</div>
    <button id="authBtn" class="user-btn" onclick="openLoginModal()"><i class="fas fa-user"></i> Login</button>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="Gaana ya singer khojein..." onkeyup="filterSongs()">
    <div class="yt-box">
      <input type="text" id="ytInput" class="search-input" placeholder="YouTube Video Link daalein...">
      <button class="yt-btn" onclick="playYouTube()"><i class="fab fa-youtube"></i> Play YT</button>
    </div>
  </div>

  <div id="ytBox" class="yt-view">
    <button class="yt-close" onclick="closeYouTube()">✕</button>
    <div id="ytFrameWrap"></div>
  </div>

  <div class="tab-bar">
    <div>
      <button id="tabAll" class="tab-btn active" onclick="setTab('all')">Trending Lo-Fi Songs</button>
      <button id="tabHist" class="tab-btn" onclick="setTab('history')">🕒 History</button>
    </div>
    <button id="clearBtn" class="clear-btn" onclick="clearHist()">Clear</button>
  </div>

  <a href="https://omg10.com/4/11936214" target="_blank" class="ad-btn">
    🔥 Special Offers & Rewards (Tap Here)
  </a>

  <ul class="song-list" id="songList"></ul>

  <div class="modal" id="loginModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeLoginModal()">✕</button>
      <div style="font-weight:bold; margin-bottom:12px; text-align:center;">User Login</div>
      <input type="text" id="nameInp" class="modal-input" placeholder="Apna Naam Daalein">
      <button class="modal-btn" onclick="doLogin()">Save & Login</button>
    </div>
  </div>

  <script>
    var currentTab = 'all';
    var currentIndex = -1;
    var adCounter = 0;

    // Real Singer Voice Lo-Fi Songs (YouTube IDs of Original Vocal Tracks)
    var songList = [
      {
        title: "Kesariya (Lo-Fi Vocal)",
        artist: "Arijit Singh",
        ytId: "BddP6PYo2gs",
        cover: "https://img.youtube.com/vi/BddP6PYo2gs/hqdefault.jpg"
      },
      {
        title: "Raataan Lambiyan (Lo-Fi Slowed)",
        artist: "Jubin Nautiyal, Asees Kaur",
        ytId: "gvyUuxdRdR4",
        cover: "https://img.youtube.com/vi/gvyUuxdRdR4/hqdefault.jpg"
      },
      {
        title: "Apna Bana Le (Lo-Fi Version)",
        artist: "Arijit Singh",
        ytId: "ElZfdU54Cp8",
        cover: "https://img.youtube.com/vi/ElZfdU54Cp8/hqdefault.jpg"
      },
      {
        title: "Shayad (Lo-Fi Acoustic)",
        artist: "Arijit Singh, Pritam",
        ytId: "x0vQ8x9x3Ww",
        cover: "https://img.youtube.com/vi/x0vQ8x9x3Ww/hqdefault.jpg"
      },
      {
        title: "Rabba Janda (Lo-Fi Vibe)",
        artist: "Jubin Nautiyal",
        ytId: "xR3V5CE8F6c",
        cover: "https://img.youtube.com/vi/xR3V5CE8F6c/hqdefault.jpg"
      }
    ];

    var songsToDisplay = songList.slice();
    var historyList = [];

    function getStored(key) {
      try { return localStorage.getItem(key); } catch(e) { return null; }
    }
    function setStored(key, val) {
      try { localStorage.setItem(key, val); } catch(e) {}
    }

    var savedH = getStored('rk_hist');
    if (savedH) {
      try { historyList = JSON.parse(savedH); } catch(e) { historyList = []; }
    }

    var listEl = document.getElementById('songList');
    var authBtn = document.getElementById('authBtn');

    function render() {
      listEl.innerHTML = '';
      if (currentTab === 'all') {
        if (songsToDisplay.length === 0) {
          listEl.innerHTML = '<li style="text-align:center; padding:20px; color:#666;">Koi gaana nahi mila</li>';
          return;
        }
        songsToDisplay.forEach(function(s, idx) {
          var li = document.createElement('li');
          li.className = 'song-item';
          li.onclick = function() { playSong(idx); };
          li.innerHTML = 
            '<img src="' + s.cover + '" alt="cover">' +
            '<div class="song-info">' +
              '<div class="song-title ' + (currentIndex === idx ? 'active' : '') + '">' + s.title + '</div>' +
              '<div class="song-artist">' + s.artist + '</div>' +
            '</div>' +
            '<div class="play-icon ' + (currentIndex === idx ? 'active' : '') + '">' +
              '<i class="fas fa-play"></i>' +
            '</div>';
          listEl.appendChild(li);
        });
      } else {
        if (historyList.length === 0) {
          listEl.innerHTML = '<li style="text-align:center; padding:30px; color:#666;">Abhi tak koi gaana nahi suna gaya hai.</li>';
          return;
        }
        historyList.forEach(function(item, idx) {
          var li = document.createElement('li');
          li.className = 'song-item';
          li.onclick = function() { playFromHist(idx); };
          li.innerHTML = 
            '<img src="' + item.cover + '" alt="cover">' +
            '<div class="song-info">' +
              '<div class="song-title">' + item.title + '</div>' +
              '<div class="song-artist">' + item.artist + ' • <span style="color:#1db954;">' + (item.time || '') + '</span></div>' +
            '</div>' +
            '<div class="play-icon"><i class="fas fa-play"></i></div>';
          listEl.appendChild(li);
        });
      }
    }

    function addHistory(title, artist, cover, ytId) {
      historyList = historyList.filter(function(h) { return h.title !== title; });
      historyList.unshift({
        title: title,
        artist: artist,
        cover: cover,
        ytId: ytId,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      if (historyList.length > 25) historyList.pop();
      setStored('rk_hist', JSON.stringify(historyList));
      if (currentTab === 'history') render();
    }

    function checkAd() {
      adCounter++;
      if (adCounter % 2 === 0) {
        window.open("https://omg10.com/4/11936214", '_blank');
      }
    }

    function playSong(idx) {
      checkAd();
      currentIndex = idx;
      var s = songsToDisplay[idx];
      startYouTube(s.ytId, s.title, s.artist, s.cover);
      render();
    }

    function playFromHist(idx) {
      var item = historyList[idx];
      startYouTube(item.ytId, item.title, item.artist, item.cover);
    }

    function startYouTube(id, title, artist, cover) {
      var ytBox = document.getElementById('ytBox');
      var wrap = document.getElementById('ytFrameWrap');
      wrap.innerHTML = '<iframe src="https://www.youtube.com/embed/' + id + '?autoplay=1&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
      ytBox.style.display = 'block';

      // Scroll to video smooth
      ytBox.scrollIntoView({ behavior: 'smooth' });

      var trackCover = cover || ("https://img.youtube.com/vi/" + id + "/hqdefault.jpg");
      addHistory(title, artist || "Vocal Track", trackCover, id);
    }

    function playYouTube() {
      var val = document.getElementById('ytInput').value.trim();
      if (!val) { alert("YouTube link daalein!"); return; }

      var id = "";
      if (val.indexOf("youtu.be/") !== -1) {
        id = val.split("youtu.be/")[1].split("?")[0];
      } else if (val.indexOf("watch?v=") !== -1) {
        id = val.split("watch?v=")[1].split("&")[0];
      } else if (val.indexOf("embed/") !== -1) {
        id = val.split("embed/")[1].split("?")[0];
      } else if (val.length === 11) {
        id = val;
      }

      if (!id) { alert("Sahi YouTube link nahi mila!"); return; }
      checkAd();
      startYouTube(id, "YouTube Song (" + id + ")", "Singer Voice", "");
    }

    function closeYouTube() {
      document.getElementById('ytFrameWrap').innerHTML = '';
      document.getElementById('ytBox').style.display = 'none';
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tabAll').className = 'tab-btn ' + (tab === 'all' ? 'active' : '');
      document.getElementById('tabHist').className = 'tab-btn ' + (tab === 'history' ? 'active' : '');
      document.getElementById('clearBtn').style.display = (tab === 'history' ? 'block' : 'none');
      render();
    }

    function clearHist() {
      if (confirm("Kya aap poori history delete karna chahte hain?")) {
        historyList = [];
        setStored('rk_hist', '[]');
        render();
      }
    }

    function filterSongs() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      songsToDisplay = songList.filter(function(s) {
        return s.title.toLowerCase().indexOf(q) !== -1 || s.artist.toLowerCase().indexOf(q) !== -1;
      });
      if (currentTab === 'all') render();
    }

    function openLoginModal() {
      var user = getStored('rk_user');
      if (user) {
        if (confirm("Aap " + user + " ke roop me logged in hain. Logout karein?")) {
          setStored('rk_user', '');
          checkUser();
        }
      } else {
        document.getElementById('loginModal').className = 'modal active';
      }
    }

    function closeLoginModal() {
      document.getElementById('loginModal').className = 'modal';
    }

    function doLogin() {
      var name = document.getElementById('nameInp').value.trim();
      if (!name) { alert("Kripya apna naam bharein!"); return; }
      setStored('rk_user', name);
      alert("Swagat hai " + name + "! Aap login ho gaye hain.");
      closeLoginModal();
      checkUser();
    }

    function checkUser() {
      var user = getStored('rk_user');
      if (user) {
        authBtn.innerHTML = '<i class="fas fa-check-circle"></i> ' + user.split(' ')[0];
        authBtn.style.color = '#fff';
        authBtn.style.background = '#1db954';
      } else {
        authBtn.innerHTML = '<i class="fas fa-user"></i> Login';
        authBtn.style.color = '#1db954';
        authBtn.style.background = '#242424';
      }
    }

    render();
    checkUser();
  </script>
</body>
</html>
