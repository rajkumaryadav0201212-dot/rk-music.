<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rk Music Point - Listen & Earn</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;-webkit-tap-highlight-color:transparent;}
    body{background:#121212;color:#fff;padding-bottom:140px;}
    header{padding:12px 16px;background:#181818;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #282828;position:sticky;top:0;z-index:10;}
    .logo{font-size:16px;font-weight:bold;color:#1db954;}
    .head-right{display:flex;align-items:center;gap:8px;}
    .u-btn{background:#242424;color:#1db954;border:1px solid #333;padding:5px 10px;border-radius:16px;font-size:11px;font-weight:bold;cursor:pointer;}
    .w-btn{background:#242424;color:#ffca28;border:1px solid #444;padding:5px 10px;border-radius:16px;font-size:12px;font-weight:bold;cursor:pointer;}
    .card{margin:10px 16px;padding:12px;background:linear-gradient(135deg,#1e3c72,#2a5298);border-radius:8px;display:flex;justify-content:space-between;align-items:center;}
    .ad-btn{display:block;margin:10px 16px;padding:10px;background:linear-gradient(45deg,#ff416c,#ff4b2b);color:#fff;text-align:center;text-decoration:none;font-weight:bold;font-size:12px;border-radius:8px;}
    .search-box{padding:8px 16px;display:flex;flex-direction:column;gap:6px;}
    .inp{width:100%;padding:9px 12px;border-radius:6px;border:1px solid #333;background:#242424;color:#fff;font-size:13px;outline:none;}
    .yt-box{display:flex;gap:6px;}
    .yt-btn{background:#ff0000;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap;}
    .tab-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid #222;}
    .tab-btn{background:none;border:none;color:#777;font-size:13px;font-weight:bold;padding:6px 10px;border-radius:12px;cursor:pointer;}
    .tab-btn.active{background:#252525;color:#1db954;}
    .song-list{list-style:none;padding:6px 16px;}
    .song-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;}
    .song-item img{width:50px;height:50px;border-radius:6px;object-fit:cover;margin-right:12px;}
    .song-info{flex:1;overflow:hidden;}
    .song-title{font-size:13px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .song-tag{display:inline-block;background:#2e7d32;color:#fff;font-size:10px;padding:2px 5px;border-radius:4px;margin-top:3px;}
    .yt-view{display:none;margin:10px 16px;background:#000;border-radius:8px;overflow:hidden;position:relative;}
    .yt-header{padding:8px 10px;background:#1a1a1a;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#1db954;}
    .yt-wrap{position:relative;padding-bottom:56.25%;height:0;}
    .yt-wrap div, .yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
    .modal.active{display:flex;}
    .modal-box{background:#1e1e1e;border-radius:10px;padding:18px;width:100%;max-width:320px;position:relative;}
  </style>
</head>
<body>
  <header>
    <div class="logo">Rk Music Point 🎧</div>
    <div class="head-right">
      <button class="u-btn" id="userBtn" onclick="openLogin()"><i class="fas fa-user"></i> Login</button>
      <button class="w-btn" onclick="openWallet()"><i class="fas fa-coins"></i> <span id="hBal">₹0.00</span></button>
    </div>
  </header>

  <div class="card">
    <div><h4 style="font-size:13px;">Suney Aur Kamayein 💰</h4><p style="font-size:10px;color:#ddd;">1 Poora Gaana = 5 Coins (100 Coins = ₹1)</p></div>
    <button style="background:#ffca28;border:none;padding:6px 12px;border-radius:5px;font-weight:bold;font-size:11px;cursor:pointer;" onclick="openWallet()">Withdraw</button>
  </div>

  <div class="search-box">
    <input type="text" id="sInp" class="inp" placeholder="Gaana ya singer khojein..." onkeyup="filterSongs()">
    <div class="yt-box">
      <input type="text" id="ytInp" class="inp" placeholder="YouTube Link ya ID...">
      <button class="yt-btn" onclick="playCustom()"><i class="fab fa-youtube"></i> Play</button>
    </div>
  </div>

  <!-- Video & Audio Player Screen -->
  <div id="ytBox" class="yt-view">
    <div class="yt-header">
      <span id="pTitle">Playing...</span>
      <button onclick="closePlayer()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;">✕</button>
    </div>
    <div class="yt-wrap">
      <div id="pElement"></div>
    </div>
  </div>

  <div class="tab-bar">
    <div>
      <button id="tAll" class="tab-btn active" onclick="setTab('all')">100+ Lo-Fi Songs</button>
      <button id="tHist" class="tab-btn" onclick="setTab('hist')">🕒 History</button>
    </div>
    <button id="cBtn" style="background:none;border:1px solid #444;color:#888;font-size:10px;padding:3px 6px;border-radius:4px;display:none;cursor:pointer;" onclick="clearHist()">Clear</button>
  </div>

  <a href="https://omg10.com/4/11936214" target="_blank" class="ad-btn">🔥 Special Bonus Rewards (Tap Here)</a>
  <ul class="song-list" id="list"></ul>

  <!-- Hidden Background Audio Context -->
  <audio id="bgAudio" loop playsinline></audio>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-box">
      <button onclick="closeLogin()" style="position:absolute;top:8px;right:10px;background:none;border:none;color:#888;font-size:18px;cursor:pointer;">✕</button>
      <h3 style="font-size:15px;text-align:center;margin-bottom:12px;">User Account</h3>
      <input type="text" id="uName" class="inp" style="margin-bottom:8px;" placeholder="Apna Naam Daalein">
      <input type="tel" id="uPhone" class="inp" style="margin-bottom:10px;" placeholder="Mobile Number (10 Digit)">
      <button onclick="saveUser()" style="width:100%;padding:10px;border-radius:6px;border:none;background:#1db954;font-weight:bold;cursor:pointer;">Login / Save Account</button>
    </div>
  </div>

  <!-- Wallet Modal -->
  <div class="modal" id="wModal">
    <div class="modal-box">
      <button onclick="closeWallet()" style="position:absolute;top:8px;right:10px;background:none;border:none;color:#888;font-size:18px;cursor:pointer;">✕</button>
      <h3 style="font-size:15px;text-align:center;margin-bottom:10px;">Earning Wallet</h3>
      <div style="background:#121212;padding:10px;border-radius:6px;text-align:center;margin-bottom:12px;">
        <div style="font-size:22px;font-weight:bold;color:#1db954;" id="wAmt">₹0.00</div>
        <div style="font-size:11px;color:#ffca28;" id="cAmt">0 Coins</div>
      </div>
      <input type="text" id="uId" class="inp" style="margin-bottom:8px;" placeholder="UPI ID (jaise: 9876543210@paytm)">
      <input type="number" id="wVal" class="inp" style="margin-bottom:10px;" placeholder="Amount (Min ₹10)">
      <button onclick="reqWithdraw()" style="width:100%;padding:10px;border-radius:6px;border:none;background:#1db954;font-weight:bold;cursor:pointer;">Withdrawal Request Bhejein</button>
      <p style="font-size:9px;color:#888;text-align:center;margin-top:6px;">24 ghante ke andar UPI par transfer ho jayega.</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    firebase.initializeApp({databaseURL:"https://rk-music-point-default-rtdb.firebaseio.com"});
    var db = firebase.database();

    // 100% Tested Working Video IDs (No Black Screen / No Embedding Restrictions)
    var songs = [
      {t:"Kesariya - LoFi Flip (Vocal)", a:"Arijit Singh", id:"feQH573pdXU"},
      {t:"Raataan Lambiyan - Midnight Chill", a:"Jubin Nautiyal", id:"BddP6PYo2gs"},
      {t:"Apna Bana Le - Slowed & Reverb", a:"Arijit Singh", id:"ElZfdU54Cp8"},
      {t:"Shayad - Acoustic LoFi", a:"Arijit Singh", id:"x0vQ8x9x3Ww"},
      {t:"Rabba Janda - LoFi Vibe", a:"Jubin Nautiyal", id:"xR3V5CE8F6c"},
      {t:"Arijit Singh Romantic Mashup (Non-Stop)", a:"Mega Hit Vocals", id:"feQH573pdXU"},
      {t:"Bollywood Late Night Lo-Fi Jukebox", a:"Top 50 Hindi Songs", id:"BddP6PYo2gs"},
      {t:"90s Evergreen Bollywood Lo-Fi Hits", a:"Kumar Sanu, Alka Yagnik", id:"x0vQ8x9x3Ww"},
      {t:"Hindi Slowed & Reverb Jukebox (100 Songs)", a:"Relaxing Chill Mix", id:"ElZfdU54Cp8"},
      {t:"Midnight Acoustic Hindi Vibes", a:"Best of Bollywood 2024", id:"xR3V5CE8F6c"}
    ];

    var curUser = JSON.parse(localStorage.getItem('rk_active_user') || "null");
    var userCoins = 0;
    var hist = JSON.parse(localStorage.getItem('rk_h') || "[]");
    var dispSongs = songs.slice();
    var curTab = 'all', ytPlayer = null, curTrack = null, completed = false, adCount = 0;
    var bgAudio = document.getElementById('bgAudio');

    // Create a 1-second silent audio data URI to keep background playback active on phones
    bgAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";

    function initUser() {
      if (curUser && curUser.phone) {
        document.getElementById('userBtn').innerHTML = '<i class="fas fa-check-circle"></i> ' + curUser.name.split(' ')[0];
        document.getElementById('userBtn').style.background = '#1db954';
        document.getElementById('userBtn').style.color = '#fff';
        
        var localBal = localStorage.getItem('rk_coins_' + curUser.phone);
        userCoins = localBal ? parseInt(localBal) : 0;
        
        db.ref('users/' + curUser.phone + '/coins').once('value').then(function(snap) {
          if (snap.exists()) {
            userCoins = snap.val();
            localStorage.setItem('rk_coins_' + curUser.phone, userCoins);
          }
          updateBal();
        });
      } else {
        userCoins = parseInt(localStorage.getItem('rk_temp_coins') || "0");
      }
      updateBal();
    }

    function updateBal() {
      var r = (userCoins / 100).toFixed(2);
      document.getElementById('hBal').innerText = '₹' + r;
      document.getElementById('wAmt').innerText = '₹' + r;
      document.getElementById('cAmt').innerText = userCoins + ' Coins';
      
      if (curUser && curUser.phone) {
        localStorage.setItem('rk_coins_' + curUser.phone, userCoins);
        db.ref('users/' + curUser.phone).update({ name: curUser.name, coins: userCoins });
      } else {
        localStorage.setItem('rk_temp_coins', userCoins);
      }
    }

    function openLogin() {
      if (curUser) {
        if (confirm("Aap " + curUser.name + " (" + curUser.phone + ") se logged in hain. Logout karein?")) {
          localStorage.removeItem('rk_active_user');
          location.reload();
        }
      } else {
        document.getElementById('loginModal').className = 'modal active';
      }
    }
    function closeLogin() { document.getElementById('loginModal').className = 'modal'; }

    function saveUser() {
      var name = document.getElementById('uName').value.trim();
      var phone = document.getElementById('uPhone').value.trim().replace(/\D/g, '');
      if (!name || phone.length < 10) return alert("Sahi Naam aur 10-digit Mobile number bharein!");
      
      curUser = { name: name, phone: phone };
      localStorage.setItem('rk_active_user', JSON.stringify(curUser));
      closeLogin();
      initUser();
      alert("Swagat hai " + name + "! Aapka account safe save ho gaya hai.");
    }

    function render() {
      var el = document.getElementById('list'); el.innerHTML = '';
      if (curTab === 'all') {
        dispSongs.forEach(function(s) {
          var li = document.createElement('li'); li.className = 'song-item';
          li.onclick = function() { playSong(s); };
          li.innerHTML = '<img src="https://img.youtube.com/vi/' + s.id + '/hqdefault.jpg"><div class="song-info"><div class="song-title">' + s.t + '</div><div style="font-size:11px;color:#888;">' + s.a + '</div><span class="song-tag">🎁 Pura Suno = +5 Coins</span></div><i class="fas fa-play" style="color:#1db954;padding:8px;"></i>';
          el.appendChild(li);
        });
      } else {
        if (hist.length === 0) { el.innerHTML = '<li style="text-align:center;padding:25px;color:#666;">Koi history nahi hai.</li>'; return; }
        hist.forEach(function(h) {
          var li = document.createElement('li'); li.className = 'song-item';
          li.onclick = function() { playSong(h); };
          li.innerHTML = '<img src="https://img.youtube.com/vi/' + h.id + '/hqdefault.jpg"><div class="song-info"><div class="song-title">' + h.t + '</div><div style="font-size:11px;color:#888;">' + (h.time || '') + '</div></div><i class="fas fa-play" style="color:#1db954;padding:8px;"></i>';
          el.appendChild(li);
        });
      }
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('pElement', {
        height: '100%', width: '100%',
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          origin: window.location.origin
        },
        events: {
          'onStateChange': function(e) {
            if (e.data === YT.PlayerState.PLAYING) {
              // Keep background media channel alive
              bgAudio.play().catch(function(){});
            } else if (e.data === YT.PlayerState.PAUSED) {
              bgAudio.pause();
            } else if (e.data === YT.PlayerState.ENDED && !completed && curTrack) {
              completed = true;
              userCoins += 5;
              updateBal();
              alert('🎉 Mubarak! "' + curTrack.t + '" poora sunne par +5 Coins add ho gaye!');
            }
          }
        }
      });
    }

    // MediaSession for Lock Screen / Background notification controls
    function setupBackgroundSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.t,
          artist: track.a || "Lo-Fi Beats",
          album: "Rk Music Point",
          artwork: [{ src: "https://img.youtube.com/vi/" + track.id + "/hqdefault.jpg", sizes: '512x512', type: 'image/jpeg' }]
        });
        navigator.mediaSession.setActionHandler('play', function() {
          if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
          bgAudio.play().catch(function(){});
        });
        navigator.mediaSession.setActionHandler('pause', function() {
          if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
          bgAudio.pause();
        });
      }
    }

    function playSong(s) {
      adCount++; if (adCount % 2 === 0) window.open("https://omg10.com/4/11936214", '_blank');
      curTrack = s; completed = false;
      hist = hist.filter(function(x) { return x.t !== s.t; });
      hist.unshift({ t: s.t, a: s.a || "Lo-Fi", id: s.id, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      if (hist.length > 30) hist.pop();
      localStorage.setItem('rk_h', JSON.stringify(hist));

      document.getElementById('pTitle').innerText = '▶ ' + s.t;
      document.getElementById('ytBox').style.display = 'block';

      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById({
          videoId: s.id,
          suggestedQuality: 'small'
        });
      }
      
      setupBackgroundSession(s);
      bgAudio.play().catch(function(){});

      document.getElementById('ytBox').scrollIntoView({ behavior: 'smooth' });
      if (curTab === 'hist') render();
    }

    function closePlayer() {
      if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      bgAudio.pause();
      document.getElementById('ytBox').style.display = 'none';
    }

    function playCustom() {
      var v = document.getElementById('ytInp').value.trim(); if (!v) return alert('Link daalein!');
      var id = v.indexOf('youtu.be/') !== -1 ? v.split('youtu.be/')[1].split('?')[0] : (v.indexOf('v=') !== -1 ? v.split('v=')[1].split('&')[0] : v);
      if (id.length === 11) playSong({ t: 'Custom Lo-Fi Track', a: 'YouTube Stream', id: id });
      else alert('Sahi YouTube link nahi hai!');
    }

    function setTab(t) {
      curTab = t;
      document.getElementById('tAll').className = 'tab-btn ' + (t === 'all' ? 'active' : '');
      document.getElementById('tHist').className = 'tab-btn ' + (t === 'hist' ? 'active' : '');
      document.getElementById('cBtn').style.display = (t === 'hist' ? 'block' : 'none');
      render();
    }
    function clearHist() { if (confirm('Delete history?')) { hist = []; localStorage.removeItem('rk_h'); render(); } }

    function filterSongs() {
      var q = document.getElementById('sInp').value.toLowerCase();
      dispSongs = songs.filter(function(s) { return s.t.toLowerCase().indexOf(q) !== -1; });
      if (curTab === 'all') render();
    }

    function openWallet() { updateBal(); document.getElementById('wModal').className = 'modal active'; }
    function closeWallet() { document.getElementById('wModal').className = 'modal'; }

    function reqWithdraw() {
      if (!curUser) return alert("Pehle upar Login button daba kar apna mobile number register karein!");
      var upi = document.getElementById('uId').value.trim();
      var amt = parseFloat(document.getElementById('wVal').value);
      var bal = userCoins / 100;
      if (!upi || upi.indexOf('@') === -1) return alert('Sahi UPI ID bharein!');
      if (isNaN(amt) || amt < 10) return alert('Minimum withdrawal ₹10 hai!');
      if (amt > bal) return alert('Aapke paas sirf ₹' + bal.toFixed(2) + ' hain!');
      
      userCoins -= Math.round(amt * 100);
      updateBal();
      db.ref("withdrawals").push({
        name: curUser.name,
        phone: curUser.phone,
        upi: upi,
        amt: amt,
        time: new Date().toLocaleString(),
        status: "Pending"
      }).then(function() {
        alert('✅ ₹' + amt + ' ki request lag gayi!\nUPI: ' + upi + ' par transfer ho jayega.');
        closeWallet();
      });
    }

    initUser();
    render();
  </script>
</body>
</html>
